[package]
name = "loom-tauri"
description = "Tauri 2 desktop shell: hosts the UI and adapts the loom-app API to Tauri commands and events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The end-to-end test picker (Phase 4 plan, decision 14 d): fixed files
# instead of native dialogs. Never in a release build.
e2e = []

[dependencies]
loom-app.workspace = true
loom-integrations.workspace = true
loom-persistence.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = "2.12.5"
# The file dialogs, called from Rust only (decision 10); MIT or Apache-2.0.
tauri-plugin-dialog = "2"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = "2.7.4"
