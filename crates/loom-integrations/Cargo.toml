[package]
name = "loom-integrations"
description = "Network integrations (trade, character import, updates) and the MCP addon transport (host layer)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
loom-domain.workspace = true
loom-app.workspace = true
# The MCP token (ADR-017): the OS random source; MIT or Apache-2.0.
getrandom = "0.4"
# The MCP token kept between starts in the OS's protected store (ADR-017
# Amendment 1, ADR-011): Windows Credential Manager, the macOS Keychain, the
# Linux kernel keyring (no D-Bus or C library); MIT or Apache-2.0.
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
serde.workspace = true
serde_json.workspace = true
# The data feed (Phase 5, P4): HTTPS through the OS's TLS (native-tls, not
# rustls with webpki-roots: review M12); the same reqwest the updater uses.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "blocking", "system-proxy"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
loom-serialization.workspace = true

[lints]
workspace = true
