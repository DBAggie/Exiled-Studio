[package]
name = "loom-serialization"
description = "Versioned persistence DTOs, migrations, and legacy XML adapters (core, wasm32)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# JSON Schema derives on the DTOs; only tools/schema-gen enables it (Phase 2
# plan, decision 11).
schema = ["dep:schemars"]

[dependencies]
loom-domain.workspace = true
roxmltree = "0.21"
schemars = { workspace = true, optional = true }
serde.workspace = true
# float_roundtrip: finite numbers read back to the same bits (dto::v1).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[lints]
workspace = true
