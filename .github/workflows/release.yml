name: Release

# Phase 5 (docs/phase-5/packaging.md, docs/release/signing.md): every
# artifact built, installed, started, and uninstalled on Windows and Linux;
# on a v* tag, a draft GitHub release the maintainer publishes. Run by hand
# (workflow_dispatch) for the gate's recorded run. Secrets live in the
# `release` environment (required reviewer: the maintainer; deployments
# limited to v* tags and main), so pull requests never see them.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
jobs:
  windows:
    name: Windows artifacts
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json # version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - name: Data key (throwaway when the secret is absent)
        shell: bash
        env:
          LOOM_DATA_KEY: ${{ secrets.LOOM_DATA_KEY }}
        run: bash tools/package/data-key.sh
      - name: Update key (throwaway when the secret is absent)
        shell: bash
        env:
          LOOM_UPDATER_KEY: ${{ secrets.LOOM_UPDATER_KEY }}
          LOOM_UPDATER_KEY_PASSWORD: ${{ secrets.LOOM_UPDATER_KEY_PASSWORD }}
        run: bash tools/package/updater-key.sh
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "loom-tauri") | .version')" >> "$GITHUB_OUTPUT"
      # Before any `tauri build`: the bundler patches the executable in place.
      - name: Portable zip
        shell: pwsh
        run: |
          cargo build --release --locked -p loom-tauri --features tauri/custom-protocol
          ./tools/package/portable.ps1 target/release/loom-tauri.exe out/release ${{ steps.version.outputs.version }}
      - name: NSIS setup (WebView2 offline installer inside)
        run: ui/node_modules/.bin/tauri build --bundles nsis --config crates/loom-tauri/tauri.nsis.conf.json --config crates/loom-tauri/tauri.updater.conf.json
      - name: MSI
        run: ui/node_modules/.bin/tauri build --bundles msi --config crates/loom-tauri/tauri.updater.conf.json
      - name: Collect
        shell: bash
        run: cp target/release/bundle/nsis/*-setup.exe* target/release/bundle/msi/*.msi* out/release/
      - name: Portable zip, started
        shell: pwsh
        run: ./tools/package/smoke.ps1 (Get-ChildItem out/release/*-portable.zip).FullName plain ${{ steps.version.outputs.version }}
      - name: NSIS, installed, started, uninstalled
        shell: pwsh
        run: ./tools/package/install-windows.ps1 nsis (Get-ChildItem out/release/*-setup.exe).FullName ${{ steps.version.outputs.version }}
      - name: MSI, installed, started, uninstalled
        shell: pwsh
        run: ./tools/package/install-windows.ps1 msi (Get-ChildItem out/release/*.msi).FullName ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: out/release
          if-no-files-found: error

  linux:
    name: Linux artifacts
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev \
            xvfb file
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json # version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - name: Data key (throwaway when the secret is absent)
        shell: bash
        env:
          LOOM_DATA_KEY: ${{ secrets.LOOM_DATA_KEY }}
        run: bash tools/package/data-key.sh
      - name: Update key (throwaway when the secret is absent)
        shell: bash
        env:
          LOOM_UPDATER_KEY: ${{ secrets.LOOM_UPDATER_KEY }}
          LOOM_UPDATER_KEY_PASSWORD: ${{ secrets.LOOM_UPDATER_KEY_PASSWORD }}
        run: bash tools/package/updater-key.sh
      - name: Version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "loom-tauri") | .version')" >> "$GITHUB_OUTPUT"
      - name: AppImage and .deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          ui/node_modules/.bin/tauri build --bundles appimage,deb --config crates/loom-tauri/tauri.updater.conf.json
          mkdir -p out/release
          cp target/release/bundle/appimage/*.AppImage* target/release/bundle/deb/*.deb out/release/
      - name: AppImage, started
        run: xvfb-run -a bash tools/package/smoke.sh out/release/*.AppImage app-image ${{ steps.version.outputs.version }}
      - name: .deb, installed, started, removed
        run: bash tools/package/install-deb.sh out/release/*.deb ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: out/release
          if-no-files-found: error

  # On a v* tag only: a draft release with every artifact; the maintainer
  # reviews and publishes it (MQ5).
  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      # The update feed; the published release serves it at
      # releases/latest/download/latest.json (tauri.conf.json's endpoint).
      - name: Update feed
        run: bash tools/package/latest-json.sh out "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > out/latest.json
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Exiled Studio ${GITHUB_REF_NAME#v}" --notes "Draft: the maintainer writes the notes and publishes." \
            out/*
