name: Release

# Phase 5 (docs/phase-5/packaging.md, docs/release/signing.md): every
# artifact built, installed, started, and uninstalled on Windows and Linux;
# on a v* tag, a draft GitHub release the maintainer publishes. Run by hand
# (workflow_dispatch) for the gate's recorded run. Secrets live in the
# `release` environment (required reviewer: the maintainer; deployments
# limited to v* tags, main, and experimental), so pull requests never see
# them.
#
# Two channels (docs/release/channels.md; tools/package/channel.sh): a tag
# v1.2.0 on main releases the stable application; a tag v1.2.0-3 on
# experimental releases the experimental one, another application beside
# it (tauri.experimental.conf.json, LOOM_CHANNEL), as a pre-release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Secrets: each key step gets its secret alone and writes it to a file in
# RUNNER_TEMP (tools/package/data-key.sh, updater-key.sh), never to the
# job's environment; the data key is deleted once the shipped pack is
# signed, and the update key reaches only the `tauri build` commands
# (with-updater-key.sh). The draft job's feed step gets the data key alone.
# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
jobs:
  channel:
    name: Channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      config: ${{ steps.channel.outputs.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - id: channel
        run: bash tools/package/channel.sh

  windows:
    name: Windows artifacts
    needs: channel
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    env:
      LOOM_CHANNEL: ${{ needs.channel.outputs.channel }}
      CHANNEL_CONFIG: ${{ needs.channel.outputs.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json # version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - name: Data key (throwaway when the secret is absent)
        shell: bash
        env:
          LOOM_DATA_KEY: ${{ secrets.LOOM_DATA_KEY }}
        run: bash tools/package/data-key.sh
      - name: Update key (throwaway when the secret is absent)
        shell: bash
        env:
          LOOM_UPDATER_KEY: ${{ secrets.LOOM_UPDATER_KEY }}
          LOOM_UPDATER_KEY_PASSWORD: ${{ secrets.LOOM_UPDATER_KEY_PASSWORD }}
        run: bash tools/package/updater-key.sh
      - name: Shipped game data (release/bundle.json; none until the maintainer's)
        shell: bash
        run: bash tools/package/shipped-bundle.sh
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "loom-tauri") | .version')" >> "$GITHUB_OUTPUT"
      # Before any `tauri build`: the bundler patches the executable in place.
      - name: Portable zip
        shell: pwsh
        run: |
          # A plain build reads the channel's config from TAURI_CONFIG (the
          # tauri CLI passes --config files the same way).
          if ($env:LOOM_CHANNEL -eq 'experimental') { $env:TAURI_CONFIG = Get-Content -Raw crates/loom-tauri/tauri.experimental.conf.json }
          cargo build --release --locked -p loom-tauri --features tauri/custom-protocol
          ./tools/package/portable.ps1 target/release/loom-tauri.exe out/release ${{ steps.version.outputs.version }}
      - name: NSIS setup (WebView2 offline installer inside)
        shell: bash
        run: bash tools/package/with-updater-key.sh ui/node_modules/.bin/tauri build --bundles nsis --config crates/loom-tauri/tauri.nsis.conf.json --config crates/loom-tauri/tauri.updater.conf.json $CHANNEL_CONFIG $SHIPPED_CONFIG
      - name: MSI
        shell: bash
        run: bash tools/package/with-updater-key.sh ui/node_modules/.bin/tauri build --bundles msi --config crates/loom-tauri/tauri.updater.conf.json $CHANNEL_CONFIG $SHIPPED_CONFIG
      - name: Collect
        shell: bash
        run: |
          cp target/release/bundle/nsis/*-setup.exe* target/release/bundle/msi/*.msi* out/release/
          # The shipped pack once, for the data feed (the Windows job's).
          cp crates/loom-tauri/shipped/*.loombundle out/release/ 2>/dev/null || true
      - name: Portable zip, started
        shell: pwsh
        run: ./tools/package/smoke.ps1 (Get-ChildItem out/release/*-portable.zip).FullName plain ${{ steps.version.outputs.version }}
      - name: NSIS, installed, started, uninstalled
        shell: pwsh
        run: ./tools/package/install-windows.ps1 nsis (Get-ChildItem out/release/*-setup.exe).FullName ${{ steps.version.outputs.version }}
      - name: MSI, installed, started, uninstalled
        shell: pwsh
        run: ./tools/package/install-windows.ps1 msi (Get-ChildItem out/release/*.msi).FullName ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: out/release
          if-no-files-found: error

  linux:
    name: Linux artifacts
    needs: channel
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 90
    env:
      LOOM_CHANNEL: ${{ needs.channel.outputs.channel }}
      CHANNEL_CONFIG: ${{ needs.channel.outputs.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev \
            xvfb file
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json # version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm build
        working-directory: ui
      - name: Data key (throwaway when the secret is absent)
        shell: bash
        env:
          LOOM_DATA_KEY: ${{ secrets.LOOM_DATA_KEY }}
        run: bash tools/package/data-key.sh
      - name: Update key (throwaway when the secret is absent)
        shell: bash
        env:
          LOOM_UPDATER_KEY: ${{ secrets.LOOM_UPDATER_KEY }}
          LOOM_UPDATER_KEY_PASSWORD: ${{ secrets.LOOM_UPDATER_KEY_PASSWORD }}
        run: bash tools/package/updater-key.sh
      - name: Shipped game data (release/bundle.json; none until the maintainer's)
        shell: bash
        run: bash tools/package/shipped-bundle.sh
      - name: Version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "loom-tauri") | .version')" >> "$GITHUB_OUTPUT"
      - name: AppImage and .deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          bash tools/package/with-updater-key.sh ui/node_modules/.bin/tauri build --bundles appimage,deb --config crates/loom-tauri/tauri.updater.conf.json $CHANNEL_CONFIG $SHIPPED_CONFIG
          mkdir -p out/release
          cp target/release/bundle/appimage/*.AppImage* target/release/bundle/deb/*.deb out/release/
      - name: AppImage, started
        run: xvfb-run -a bash tools/package/smoke.sh out/release/*.AppImage app-image ${{ steps.version.outputs.version }}
      - name: .deb, installed, started, removed
        run: bash tools/package/install-deb.sh out/release/*.deb ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: out/release
          if-no-files-found: error

  # On a v* tag only: a draft release with every artifact; the maintainer
  # reviews and publishes it (MQ5). An experimental one is a pre-release,
  # so GitHub's `latest` (the stable feeds) never names it; publishing it
  # runs pages.yml, which copies its feeds to the project site.
  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [channel, windows, linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      # The scripts and the release tool (tools/package, tools/release).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      # The update feed. A stable release serves it at
      # releases/latest/download/latest.json (tauri.conf.json's endpoint);
      # an experimental one through the site
      # (tauri.experimental.conf.json's).
      - name: Update feed
        run: bash tools/package/latest-json.sh out "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > out/latest.json
      # The data feed listing the shipped pack, signed with the data key
      # (a tag's run always has the secret); its sequence is the run
      # number, which only grows.
      - name: Data feed
        env:
          LOOM_DATA_KEY: ${{ secrets.LOOM_DATA_KEY }}
        run: bash tools/package/data-feed.sh out "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "${{ github.run_number }}"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.channel.outputs.channel }}
        run: |
          args=(--draft --title "Exiled Studio ${GITHUB_REF_NAME#v}")
          if [ "$CHANNEL" = experimental ]; then
            args=(--draft --prerelease --title "Exiled Studio Experimental ${GITHUB_REF_NAME#v}")
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}" \
            --notes "Draft: the maintainer writes the notes and publishes." out/*
