name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - run: cargo fmt --all --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ADR-001/012: Windows and Linux gate; macOS is best-effort.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-features --locked

  wasm:
    name: wasm32 core crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml (includes wasm32 target)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # ADR-016. Keep this list in sync with CORE_CRATES in AGENTS.md.
      - name: Build core crates for wasm32-unknown-unknown
        run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p loom-domain -p loom-data -p loom-parser -p loom-calc -p loom-serialization

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json # version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build

  # The ADR-012 PR-evidence check is in pr-evidence.yml so editing a PR description re-runs it.

  # Required status check for branch protection (with "PR evidence" from pr-evidence.yml).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, rust, wasm, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require gated jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # rust is continue-on-error for macOS only, so a Windows/Linux failure still fails the job.
          echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")'
