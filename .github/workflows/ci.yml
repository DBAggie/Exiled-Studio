name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - run: cargo fmt --all --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ADR-001/012: Windows and Linux gate; macOS is best-effort.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-features --locked
      # Spike C gate item 3: the committed divergence register is valid (also
      # checked by cargo test; this is the CLI a contributor runs).
      - name: Divergence register
        if: runner.os == 'Linux'
        run: cargo run --locked -p loom-parity-cli -- divergence-check docs/parity/divergence-register.json
      # Phase 2 step 7: the v1 build document of every public fixture, for
      # dto-compare (Windows against Linux). The command also fails when a
      # second run differs or a document does not read back.
      - name: Build documents (dto-hashes)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p out/dto
          cargo run --locked -p loom-parity-cli -- dto-hashes tools/oracle/fixtures tools/oracle/fixtures/community > out/dto/dto-hashes.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os != 'macOS'
        with:
          name: dto-${{ runner.os }}
          path: out/dto
          if-no-files-found: error

  # Phase 2 step 7: the build documents are byte-identical on Windows and
  # Linux (as in oracle cross-platform). Runs when a rust job failed too (and
  # then fails itself: a run is missing), but not when the run was cancelled.
  dto-compare:
    name: dto cross-platform
    needs: [rust, round-trip]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dto-*
          path: out
      - name: Compare Windows with Linux
        run: |
          [ -f out/dto-Windows/dto-hashes.json ] && [ -f out/dto-Linux/dto-hashes.json ] || { echo "a dto-hashes run is missing" >&2; exit 1; }
          sha256sum out/dto-*/dto-hashes.json | tee -a "$GITHUB_STEP_SUMMARY"
          diff out/dto-Windows/dto-hashes.json out/dto-Linux/dto-hashes.json
      # Phase 2 step 8: the resolved synthetic builds and the public fixtures
      # through build-round-trip (documents' SHA-256 per build).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: round-trip-*
          path: out
      - name: Compare build-round-trip documents, Windows with Linux
        run: |
          for set in public poe1 poe2; do
            w="out/round-trip-Windows/$set-hashes.json"; l="out/round-trip-Linux/$set-hashes.json"
            [ -f "$w" ] && [ -f "$l" ] || { echo "a build-round-trip run is missing ($set)" >&2; exit 1; }
            diff "$w" "$l"
          done

  # Phase 2 decision 11: the committed JSON Schema and TypeScript are what
  # the DTOs generate. Regenerates both and fails on any difference.
  schema:
    name: schema freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json # version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: cargo run --locked -p loom-schema-gen -- schemas
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm generate:schema
        working-directory: ui
      - name: No difference
        run: |
          changed="$(git status --porcelain -- schemas ui/src/generated)"
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- schemas ui/src/generated
            echo "stale generated files: run 'cargo run -p loom-schema-gen', then 'pnpm generate:schema' in ui/" >&2
            exit 1
          fi

  # Phase 2 step 8 (gates 1a, 2, 3b, 3c): build-round-trip on the public
  # fixtures (no bundle; malformed.xml must not import) and on the synthetic
  # PoE1 and PoE2 builds with their synthetic bundles, on Windows and Linux;
  # dto-compare diffs the documents' SHA-256 between the two. Then the scan
  # for PoE1-only identifiers in shared code. Exit codes: build-round-trip
  # in tools/parity-cli/src/main.rs (USAGE).
  round-trip:
    name: build round-trip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Release: the mutation set runs thousands of import and export cycles.
      - name: Build loom-parity-cli
        run: cargo build --release --locked -p loom-parity-cli
      - name: Public fixtures (no bundle)
        run: >-
          target/release/loom-parity-cli build-round-trip
          tools/oracle/fixtures tools/oracle/fixtures/community
          --expect-import-error malformed.xml --out out/round-trip/public
      - name: Synthetic PoE1 build with the synthetic PoE1 bundle
        run: >-
          target/release/loom-parity-cli build-round-trip
          tools/parity-cli/testdata/build-round-trip/synthetic-poe1.xml
          --bundle crates/loom-data/tests/fixtures/bundle-poe1 --out out/round-trip/poe1
      - name: Synthetic PoE2 build with the synthetic PoE2 bundle (gate 3b)
        run: >-
          target/release/loom-parity-cli build-round-trip
          tools/parity-cli/testdata/build-round-trip/synthetic-poe2.json
          --bundle crates/loom-data/tests/fixtures/bundle-poe2 --out out/round-trip/poe2
      - name: Every public fixture ran; the synthetic builds resolved
        run: |
          jq -e '.builds >= 25 and .failed == 0 and .checks.d_source_lines.pass >= 24' out/round-trip/public/summary.json
          for game in poe1 poe2; do
            jq -e '.failed == 0 and .modifier_lines.resolved > 0 and (.modifier_lines.pending // 0) == 0' "out/round-trip/$game/summary.json"
          done
      - name: No PoE1-only identifiers in shared code (gate 3c)
        if: runner.os == 'Linux'
        run: cargo test --locked -p loom-parser --test no_poe1_identifiers
      - name: Document hashes (for dto-compare)
        run: |
          for set in public poe1 poe2; do
            jq '[.per_build[] | {name, json_sha256}]' "out/round-trip/$set/summary.json" > "out/round-trip/$set-hashes.json"
          done
      - name: Summary
        if: always()
        run: |
          for f in out/round-trip/*/summary.json; do
            [ -f "$f" ] || continue
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            jq '{builds, passed, failed, checks, modifier_lines, mutations}' "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: round-trip-${{ runner.os }}
          path: out/round-trip
          if-no-files-found: ignore

  # Spike C step 4: the PoB oracle on the public fixtures (tools/oracle/fixtures/
  # fixtures.json), 3 runs each. Required through ci-ok since C5, after 10
  # consecutive green runs on both runners (maintainer, 2026-11-10;
  # docs/spikes/spike-c-oracle.md, section 7).
  oracle:
    name: oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A cache miss fetches PoB and builds LuaJIT; a hang must not run for hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build loom-parity-cli
        run: cargo build --release --locked -p loom-parity-cli
      # The runtime is built from the pinned sources; the key changes with the
      # pins or the scripts. A cached build is checked like a fresh one.
      - name: Restore the oracle runtime
        id: oracle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('tools/oracle/manifest.json', 'tools/oracle/acquire.sh', 'tools/oracle/acquire.ps1') }}
      - name: Acquire the oracle (Linux)
        if: runner.os == 'Linux' && steps.oracle-cache.outputs.cache-hit != 'true'
        run: tools/oracle/acquire.sh
      - name: Acquire the oracle (Windows)
        if: runner.os == 'Windows' && steps.oracle-cache.outputs.cache-hit != 'true'
        # acquire.ps1 targets Windows PowerShell 5.1, as on the workstation.
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -File tools/oracle/acquire.ps1
      - name: Verify the oracle
        run: target/release/loom-parity-cli oracle-verify tools/oracle/manifest.json local/oracle
      # Linux runs without a network (a user and network namespace); Ubuntu
      # 24.04 restricts unprivileged user namespaces through AppArmor, so the
      # restriction is lifted on this throwaway runner first.
      - name: Run the fixtures (Linux, no network)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if unshare -rn python3 -I -c 'import socket; socket.create_connection(("1.1.1.1", 53), 3)' 2>/dev/null; then
            echo "network reachable inside the namespace" >&2
            exit 1
          fi
          echo "no network inside the namespace"
          unshare -rn target/release/loom-parity-cli oracle-run tools/oracle/manifest.json local/oracle \
            --out out/oracle tools/oracle/fixtures/fixtures.json
      - name: Run the fixtures (Windows)
        if: runner.os == 'Windows'
        run: >-
          target/release/loom-parity-cli oracle-run tools/oracle/manifest.json local/oracle
          --out out/oracle tools/oracle/fixtures/fixtures.json
      - name: Summary
        if: always()
        run: |
          [ -f out/oracle/summary.md ] && cat out/oracle/summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -f local/oracle/build.json ] && { echo '```json'; cat local/oracle/build.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oracle-${{ runner.os }}
          path: out/oracle
          if-no-files-found: ignore

  # Windows and Linux outputs compared field by field (oracle-compare). PoB's
  # own fixtures are checked out with CRLF on Windows, so they show
  # input_differs. Runs when an oracle job failed too (and then fails itself:
  # a run is missing), but not when the run was cancelled.
  oracle-compare:
    name: oracle cross-platform
    needs: [oracle]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oracle-*
          path: out
      # ADR-006: an unregistered difference (exit 20) fails; only registered
      # differences (exit 19) pass, and are listed in the step summary.
      - name: Compare Windows with Linux
        run: |
          [ -f out/oracle-Windows/report.json ] && [ -f out/oracle-Linux/report.json ] || { echo "an oracle run is missing" >&2; exit 1; }
          set +e
          cargo run --release --locked -p loom-parity-cli -- oracle-compare out/oracle-Windows out/oracle-Linux --out out/compare
          code=$?
          set -e
          echo "oracle-compare exit $code (0 identical, 19 only registered differences, 20 unregistered differences)" >> "$GITHUB_STEP_SUMMARY"
          [ -f out/compare/summary.md ] && cat out/compare/summary.md >> "$GITHUB_STEP_SUMMARY"
          case $code in 0|19) exit 0 ;; *) exit "$code" ;; esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oracle-compare
          path: out/compare
          if-no-files-found: ignore

  wasm:
    name: wasm32 core crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml (includes wasm32 target)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # ADR-016. Keep this list in sync with CORE_CRATES in AGENTS.md.
      - name: Build core crates for wasm32-unknown-unknown
        run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p loom-domain -p loom-data -p loom-parser -p loom-calc -p loom-serialization

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Policy in deny.toml. Advisories are not checked yet: the advisory DB changes
      # without a code change, so it needs its own non-blocking job (handoff follow-up).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          arguments: --all-features --locked
          command: check
          command-arguments: licenses bans sources

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json # version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build

  # The ADR-012 PR-evidence check is in pr-evidence.yml so editing a PR description re-runs it.

  # Required status check for branch protection (with "PR evidence" from pr-evidence.yml).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, rust, dto-compare, schema, round-trip, oracle, oracle-compare, wasm, deny, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require gated jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # rust is continue-on-error for macOS only, so a Windows/Linux failure still fails the job.
          echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")'
