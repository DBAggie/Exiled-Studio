name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - run: cargo fmt --all --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ADR-001/012: Windows and Linux gate; macOS is best-effort.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-features --locked
      # Spike C gate item 3: the committed divergence register is valid (also
      # checked by cargo test; this is the CLI a contributor runs).
      - name: Divergence register
        if: runner.os == 'Linux'
        run: cargo run --locked -p loom-parity-cli -- divergence-check docs/parity/divergence-register.json

  # Spike C step 4: the PoB oracle on the public fixtures (tools/oracle/fixtures/
  # fixtures.json), 3 runs each. Informational: not in ci-ok until it has been
  # green for 10 consecutive runs on both runners (maintainer, 2026-11-10; C5).
  oracle:
    name: oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A cache miss fetches PoB and builds LuaJIT; a hang must not run for hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build loom-parity-cli
        run: cargo build --release --locked -p loom-parity-cli
      # The runtime is built from the pinned sources; the key changes with the
      # pins or the scripts. A cached build is checked like a fresh one.
      - name: Restore the oracle runtime
        id: oracle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: local/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('tools/oracle/manifest.json', 'tools/oracle/acquire.sh', 'tools/oracle/acquire.ps1') }}
      - name: Acquire the oracle (Linux)
        if: runner.os == 'Linux' && steps.oracle-cache.outputs.cache-hit != 'true'
        run: tools/oracle/acquire.sh
      - name: Acquire the oracle (Windows)
        if: runner.os == 'Windows' && steps.oracle-cache.outputs.cache-hit != 'true'
        # acquire.ps1 targets Windows PowerShell 5.1, as on the workstation.
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -File tools/oracle/acquire.ps1
      - name: Verify the oracle
        run: target/release/loom-parity-cli oracle-verify tools/oracle/manifest.json local/oracle
      # Linux runs without a network (a user and network namespace); Ubuntu
      # 24.04 restricts unprivileged user namespaces through AppArmor, so the
      # restriction is lifted on this throwaway runner first.
      - name: Run the fixtures (Linux, no network)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if unshare -rn python3 -I -c 'import socket; socket.create_connection(("1.1.1.1", 53), 3)' 2>/dev/null; then
            echo "network reachable inside the namespace" >&2
            exit 1
          fi
          echo "no network inside the namespace"
          unshare -rn target/release/loom-parity-cli oracle-run tools/oracle/manifest.json local/oracle \
            --out out/oracle tools/oracle/fixtures/fixtures.json
      - name: Run the fixtures (Windows)
        if: runner.os == 'Windows'
        run: >-
          target/release/loom-parity-cli oracle-run tools/oracle/manifest.json local/oracle
          --out out/oracle tools/oracle/fixtures/fixtures.json
      - name: Summary
        if: always()
        run: |
          [ -f out/oracle/summary.md ] && cat out/oracle/summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -f local/oracle/build.json ] && { echo '```json'; cat local/oracle/build.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oracle-${{ runner.os }}
          path: out/oracle
          if-no-files-found: ignore

  # Windows and Linux outputs compared field by field (oracle-compare). PoB's
  # own fixtures are checked out with CRLF on Windows, so they show
  # input_differs; differences are reported, not failed on (exit 19 or 20).
  oracle-compare:
    name: oracle cross-platform
    needs: [oracle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oracle-*
          path: out
      # While the job is informational, differences are reported, not failed
      # on. ADR-006: an unregistered difference (exit 20) fails the gate, so
      # C5 makes 20 a failure when it promotes the job.
      - name: Compare Windows with Linux
        run: |
          [ -f out/oracle-Windows/report.json ] && [ -f out/oracle-Linux/report.json ] || { echo "an oracle run is missing" >&2; exit 1; }
          set +e
          cargo run --release --locked -p loom-parity-cli -- oracle-compare out/oracle-Windows out/oracle-Linux --out out/compare
          code=$?
          set -e
          echo "oracle-compare exit $code (0 identical, 19 only registered differences, 20 unregistered differences)" >> "$GITHUB_STEP_SUMMARY"
          [ -f out/compare/summary.md ] && cat out/compare/summary.md >> "$GITHUB_STEP_SUMMARY"
          case $code in 0|19|20) exit 0 ;; *) exit "$code" ;; esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oracle-compare
          path: out/compare
          if-no-files-found: ignore

  wasm:
    name: wasm32 core crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # reads rust-toolchain.toml (includes wasm32 target)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # ADR-016. Keep this list in sync with CORE_CRATES in AGENTS.md.
      - name: Build core crates for wasm32-unknown-unknown
        run: >-
          cargo build --locked --target wasm32-unknown-unknown
          -p loom-domain -p loom-data -p loom-parser -p loom-calc -p loom-serialization

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Policy in deny.toml. Advisories are not checked yet: the advisory DB changes
      # without a code change, so it needs its own non-blocking job (handoff follow-up).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          arguments: --all-features --locked
          command: check
          command-arguments: licenses bans sources

  frontend:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ui/package.json # version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build

  # The ADR-012 PR-evidence check is in pr-evidence.yml so editing a PR description re-runs it.

  # Required status check for branch protection (with "PR evidence" from pr-evidence.yml).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, rust, wasm, deny, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require gated jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # rust is continue-on-error for macOS only, so a Windows/Linux failure still fails the job.
          echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")'
