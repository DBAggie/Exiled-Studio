[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
# Oracle and tree export files (manifests, acquire scripts) and packaging scripts, not crates.
exclude = ["tools/oracle", "tools/tree", "tools/package"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/DBAggie/Exiled-Studio"
publish = false

[workspace.dependencies]
loom-domain = { path = "crates/loom-domain" }
loom-data = { path = "crates/loom-data" }
loom-parser = { path = "crates/loom-parser" }
loom-calc = { path = "crates/loom-calc" }
loom-serialization = { path = "crates/loom-serialization" }
loom-persistence = { path = "crates/loom-persistence" }
loom-app = { path = "crates/loom-app" }
loom-integrations = { path = "crates/loom-integrations" }
loom-pipeline = { path = "crates/loom-pipeline" }
loom-tree = { path = "crates/loom-tree" }

# Third-party crates shared across the workspace.
sha2 = "0.10"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
# Pure-Rust libm (musl's): deterministic powers for the calc's math module.
libm = "0.2"
# Host-side structured logs (Phase 5, P-f; ADR-014): never in core crates.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std", "registry"] }
# The diagnostic package's zip (stored entries; Phase 5, P-f).
crc32fast = "1.4"
# Ed25519 signatures over data bundles and feeds (Phase 5, P-c; BSD-3-Clause).
# No default features: no precomputed tables, no RNG (core crates verify only).
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# ADR-014: no unwrap/expect outside tests (tests allowed via clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
# CLAUDE.md: use #[expect(..., reason = "...")], never #[allow(...)].
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
