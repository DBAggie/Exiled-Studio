# cargo-deny policy (Spike A, PR A1a).
# CI runs `cargo deny --all-features --locked check licenses bans sources`.
# Run locally: `cargo install --locked cargo-deny@0.20.2`, then the same command.
#
# The project is MIT. Dependencies must have an open-source license (OSI-approved; maintainer
# decision 2026-11-13, "licenses that are still considered open source", which widened the
# permissive-only list of 2026-11-08). Strong copyleft (GPL, AGPL, LGPL) is not on the list:
# ADR-005 keeps GPL-derived code out of the shipped app, so such a crate fails CI and needs
# the maintainer. Anything outside the list gets a per-crate exception below with a reason.

[licenses]
allow = [
    # Permissive.
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Artistic-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "UPL-1.0",
    "Zlib",
    # File-level copyleft: crates used unmodified (today cssparser, cssparser-macros,
    # dtoa-short, option-ext, selectors, all through Tauri; until 2026-11-13 each was a
    # named exception). Their own files stay under the license.
    "EPL-2.0",
    "MPL-2.0",
    # Fonts.
    "OFL-1.1",
]
confidence-threshold = 0.93
# Some allowed licenses are not in the tree yet; that is not a problem.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Our crates are `publish = false` and MIT; check them like any other crate.
ignore = false

[bans]
# Tauri brings several duplicate versions (windows-sys, toml, syn, ...). Report, don't fail.
multiple-versions = "warn"
# Version requirements must be explicit; workspace path dependencies are fine.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io. A git or alternative-registry dependency needs an explicit entry here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
